name: Native adapter release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: agent-watchdog-hook.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: agent-watchdog-hook
          # x86_64-apple-darwin is cross-compiled on the arm64 runner: GitHub
          # retired standalone Intel macOS hosted runners (macos-13 is gone;
          # x64 macOS now only exists as a paid larger-runner tier).
          - runner: macos-latest
            target: x86_64-apple-darwin
            executable: agent-watchdog-hook
          - runner: macos-latest
            target: aarch64-apple-darwin
            executable: agent-watchdog-hook
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add --toolchain stable ${{ matrix.target }}
      - run: cargo +stable build --release --locked --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Ad-hoc sign the cross-compiled binary
        run: |
          # A native build gets an ad-hoc signature from the linker automatically;
          # this cross-compiled binary does not, and fork() from an unsigned
          # process under Rosetta silently never reaches the child's exec (seen
          # as ensure_daemon's spawned Python core never becoming "running").
          codesign --force --sign - native/target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Validate release version
        shell: bash
        run: |
          uv run python -c 'import os, tomllib; pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; cargo = tomllib.load(open("native/Cargo.toml", "rb"))["package"]["version"]; tag = os.environ["GITHUB_REF_NAME"]; assert pyproject == cargo, f"package version {pyproject} differs from native version {cargo}"; assert tag == f"v{pyproject}", f"tag {tag} must be v{pyproject}"'
      - name: Package adapter artifact
        shell: bash
        run: uv run python scripts/package_native_artifact.py --binary native/target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --version "${GITHUB_REF_NAME#v}" --output-dir dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native/*.zip
          if-no-files-found: error

  smoke:
    name: Installed artifact smoke ${{ matrix.target }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            system: Windows
            machine: AMD64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            system: Linux
            machine: x86_64
          # A cross-compiled x86_64 artifact runs under Rosetta 2 on this
          # arm64 runner, so the host's own platform.machine() (arm64)
          # would otherwise mismatch the artifact under test; pin the
          # target host explicitly for every leg instead of auto-detecting.
          - runner: macos-latest
            target: x86_64-apple-darwin
            system: Darwin
            machine: x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            system: Darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Install Rosetta 2 to run the cross-compiled Intel binary
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native
      - id: install
        name: Select packaged adapter without Rust
        shell: bash
        env:
          WATCHDOG_SMOKE_SYSTEM: ${{ matrix.system }}
          WATCHDOG_SMOKE_MACHINE: ${{ matrix.machine }}
        run: |
          artifact=$(find dist/native -name '*.zip' -print -quit)
          export ARTIFACT="$artifact"
          adapter=$(uv run python -c 'from agent_watchdog.native_artifacts import install_artifact; import os; from pathlib import Path; print(install_artifact(Path(os.environ["ARTIFACT"]).resolve(), Path(os.environ["RUNNER_TEMP"]) / "watchdog-native-adapters", system=os.environ["WATCHDOG_SMOKE_SYSTEM"], machine=os.environ["WATCHDOG_SMOKE_MACHINE"]))')
          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
      - name: Run native contracts through installed artifact
        shell: bash
        env:
          WATCHDOG_NATIVE_ADAPTER: ${{ steps.install.outputs.adapter }}
        run: uv run pytest --basetemp "$RUNNER_TEMP/watchdog-pytest-native" tests/test_rust_adapter.py

  publish:
    name: Publish checksums and release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist/native
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/native/*.zip dist/native/SHA256SUMS.txt
