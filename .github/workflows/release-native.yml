name: Native adapter release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: agent-watchdog-hook.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: agent-watchdog-hook
          - runner: macos-13
            target: x86_64-apple-darwin
            executable: agent-watchdog-hook
          - runner: macos-14
            target: aarch64-apple-darwin
            executable: agent-watchdog-hook
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add --toolchain stable ${{ matrix.target }}
      - run: cargo +stable build --release --locked --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - name: Validate release version
        shell: bash
        run: |
          uv run python -c 'import os, tomllib; pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; cargo = tomllib.load(open("native/Cargo.toml", "rb"))["package"]["version"]; tag = os.environ["GITHUB_REF_NAME"]; assert pyproject == cargo, f"package version {pyproject} differs from native version {cargo}"; assert tag == f"v{pyproject}", f"tag {tag} must be v{pyproject}"'
      - name: Package adapter artifact
        shell: bash
        run: uv run python scripts/package_native_artifact.py --binary native/target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --version "${GITHUB_REF_NAME#v}" --output-dir dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native/*.zip
          if-no-files-found: error

  smoke:
    name: Installed artifact smoke ${{ matrix.target }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native
      - id: install
        name: Select packaged adapter without Rust
        shell: bash
        run: |
          artifact=$(find dist/native -name '*.zip' -print -quit)
          export ARTIFACT="$artifact"
          adapter=$(uv run python -c 'from agent_watchdog.native_artifacts import install_artifact; import os; from pathlib import Path; print(install_artifact(Path(os.environ["ARTIFACT"]).resolve(), Path(os.environ["RUNNER_TEMP"]) / "watchdog-native-adapters"))')
          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
      - name: Run native contracts through installed artifact
        shell: bash
        env:
          WATCHDOG_NATIVE_ADAPTER: ${{ steps.install.outputs.adapter }}
        run: uv run pytest --basetemp "$RUNNER_TEMP/watchdog-pytest-native" tests/test_rust_adapter.py

  publish:
    name: Publish checksums and release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist/native
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/native/*.zip dist/native/SHA256SUMS.txt
