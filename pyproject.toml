[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-watchdog"
version = "0.1.0"
description = "Local observation of stock coding-agent harness sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "platformdirs>=4,<5",
    "pydantic>=2,<3",
    "tomli-w>=1,<2",
]

[project.scripts]
agent-watchdog = "agent_watchdog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "ty>=0.0.78",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_watchdog"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
