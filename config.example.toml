# Copy this file to the user configuration path to start with the built-in defaults.
# Registered project paths are intentionally omitted because they are machine-specific.

schema_version = 1
projects = []
auto_add_projects = false
# Record adapter and spool timing/occupancy metadata for delivery diagnostics.
pipeline_telemetry = true

[defaults]
# Capture selected prompt, tool, and assistant text after redaction. Set false to
# retain metadata only.
capture_content = true
# Keep this many bytes available for cleanup and diagnostic work per project.
reserve_bytes = 1048576
# Retain provider payloads and their artifact references for this many days; set
# to 0 to disable time-based expiry and retain them until quota pressure.
content_days = 30
# Retain events, metrics, labels, and replay fingerprints for this many days;
# set to 0 to disable time-based expiry and retain them until quota pressure.
metrics_days = 180
# Keep the daemon degraded for this many minutes after a hook references a
# transcript source that cannot be enriched. Historical reader gaps stay stored
# for diagnostics but do not hold the health status after this window.
transcript_failure_minutes = 15
# Maximum total size of regular files stored for one project (2 GiB).
project_bytes = 2147483648
# Maximum size of pending inbox data and temporary inbox files (64 MiB).
inbox_bytes = 67108864
# Maximum size of one incoming event payload (1 MiB).
payload_bytes = 1048576
# Keep this many daemon diagnostic files, including the active watchdog.log.
log_files = 5
# Rotate the active diagnostic log before it exceeds this many bytes (10 MiB).
log_bytes = 10485760
# Write INFO, WARNING, and ERROR by default; set DEBUG for hot-path decisions.
log_level = "INFO"
# Append a de-identified, truncated detail="..." clause (usually str(error)) to
# error records. Off by default so the log, exports, and shared bug reports stay
# content-free. Recommended: set true on your own local installation, where the
# detail makes failures much easier to diagnose; keep false for any log you share.
log_detail = false
# Kill switch for every action the decision-channel rules send (ask, rewrite,
# deny, context, block); see docs/rules.md. Set false here to stop them all on
# every project, and no project can switch them back on. A project can also set
# `policy_intervene = false` under [projects.overrides] to stop only its own.
policy_intervene = true
# Allow `agent-watchdog insights` to send this project's redacted evidence bundle
# to one isolated `claude -p` call when you run it. Set false to refuse every
# call; `insights --dry-run` sends nothing and keeps working.
insights_llm_enabled = true

# The quota relationship must remain:
# payload_bytes <= inbox_bytes <= project_bytes

# Optional default location of the list-price tariff file for `agent-watchdog
# usage` (see pricing.example.toml). Absolute path only; --tariffs overrides it.
# [pricing]
# tariffs = "C:/path/to/pricing.toml"

# Decision-channel rules (docs/rules.md). `agent-watchdog rules approve NAME` writes
# `approved` for a rule file in the `rules` folder next to this file; edit the rest
# with `rules enable|disable|reject`, or by hand:
# [rules]
# approved = { my_rule = "<sha256 of the approved file>" }   # a changed file is stale
# disabled = ["destructive_command"]                         # switch a rule off
# enabled = ["stop_without_verification"]                    # opt in a built-in that ships off
# tiers = ["haiku", "sonnet", "opus", "fable"]               # model families, lowest first

# To enable automatic registration, set an existing trusted directory and enable it:
# auto_add_projects = true
# trusted_projects_dir = "C:/path/to/trusted/projects"

# To register a project explicitly, add an entry like this:
# [[projects]]
# id = "00000000-0000-0000-0000-000000000000"
# root = "C:/path/to/project"
#
# Optional per-project overrides go under the project:
# [projects.overrides]
# capture_content = false
# policy_intervene = false
# insights_llm_enabled = false
